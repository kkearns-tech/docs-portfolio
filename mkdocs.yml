site_name: Popstiche Ops Documentation
site_description: Operations documentation and system design notes for Popstiche
site_url: https://kkearns-tech.github.io/popstiche-ops-docs/

repo_url: https://github.com/kkearns-tech/popstiche-ops-docs
repo_name: kkearns-tech/popstiche-ops-docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Project:
    - Charter: project/charter.md
    - Roadmap: project/roadmap.md
    - Backlog: project/backlog.md
    - Risks: project/risks.md
    - Decisions: project/decisions.md
    - Changelog: project/changelog.md
  - Status Reports:
    - Status Report (current): project/status-reports/2026-05-06.md
    - Status Reports (old): project/status-reports/2026-03-20.md
  - Product:
    - Overview: product/overview.md
    - Personas & Roles: product/personas-and-roles.md
    - Workflows:
      - Event Day: product/workflows/event-day.md
      - Prep Day: product/workflows/prep-day.md
      - Reconciliation: product/workflows/reconciliation.md
    - System:
      - Architecture: product/system/architecture.md
      - Data Model: product/system/data-model.md
      - Operational System Overview: product/system/operational-system-overview.md
#      - API: product/system/api
      - End Points: product/system/api/endpoints.md
      - Errors: product/system/api/errors.md
      - Overview: product/system/api/overview.md